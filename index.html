<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-card" aria-labelledby="game-title">
        <div class="game-header">
          <div>
            <p class="eyebrow">Classic game</p>
            <h1 id="game-title">Tic Tac Toe</h1>
          </div>
          <button id="restart-button" class="secondary-button" type="button">
            New Game
          </button>
        </div>

        <div class="status-panel" aria-live="polite">
          <p id="status-message" class="status-message">Player X, your turn</p>
          <p id="helper-message" class="helper-message">
            Select any open square to make your move.
          </p>
        </div>

        <section class="scoreboard" aria-label="Scoreboard">
          <article class="score-card score-card-x">
            <span class="score-label">Player X</span>
            <strong id="score-x" class="score-value">0</strong>
          </article>
          <article class="score-card score-card-draws">
            <span class="score-label">Draws</span>
            <strong id="score-draws" class="score-value">0</strong>
          </article>
          <article class="score-card score-card-o">
            <span class="score-label">Player O</span>
            <strong id="score-o" class="score-value">0</strong>
          </article>
        </section>

        <section class="board-wrapper" aria-label="Tic Tac Toe board">
          <div id="game-board" class="board" role="grid" aria-label="3 by 3 Tic Tac Toe board"></div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
